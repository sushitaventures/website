<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181b22"/>
      <stop offset="60%" stop-color="#0f1116"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="goldAura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="400" cy="420" r="320" fill="url(#goldAura)"/>

  <!-- Border & Corner Details -->
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="52" y="52" width="696" height="896" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.18"/>
  
  <!-- Corner L-marks -->
  <path d="M32 60 L32 32 L60 32" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M768 60 L768 32 L740 32" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M32 940 L32 968 L60 968" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M768 940 L768 968 L740 968" fill="none" stroke="#d4af37" stroke-width="2"/>

  <!-- Stylized Monogram Crest -->
  <g transform="translate(400, 390)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="120" fill="#0d0f14" stroke="#d4af37" stroke-width="2" stroke-opacity="0.85"/>
    
    <!-- Male / Director Monogram -->
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', serif" font-size="92" font-weight="600" fill="url(#goldText)" text-anchor="middle" letter-spacing="4">SA</text>
  </g>

  <!-- Name & Typography -->
  <text x="400" y="650" font-family="'Cinzel', 'Playfair Display', serif" font-size="36" font-weight="600" fill="#f8f9fa" letter-spacing="4" text-anchor="middle">SUSHIL ATTRI</text>
  <line x1="320" y1="675" x2="480" y2="675" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="400" y="715" font-family="'Manrope', sans-serif" font-size="16" font-weight="600" fill="#d4af37" letter-spacing="4" text-anchor="middle">DIRECTOR</text>
  
  <text x="400" y="770" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#a3a7b0" letter-spacing="2" text-anchor="middle">SUSHITA VENTURES</text>
  <text x="400" y="805" font-family="'Manrope', sans-serif" font-size="12" font-weight="300" fill="#717684" letter-spacing="1" text-anchor="middle">Where Trust Builds Wealth</text>
</svg>